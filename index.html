<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Pulse Studio - Meme Party</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 550px; text-align: center; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 5px; font-size: 26px; }
        .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background-color: #0284c7; color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 8px; transition: 0.2s; }
        button:hover { background-color: #0369a1; }
        .secondary-btn { background-color: #334155; }
        .secondary-btn:hover { background-color: #475569; }
        .hidden { display: none; }
        
        /* Oyun Alanı Stil Detayları */
        .meme-box { background: #0f172a; border-radius: 12px; padding: 15px; margin: 15px 0; border: 1px dashed #38bdf8; }
        .meme-title { font-size: 18px; font-weight: bold; color: #facc15; margin-bottom: 10px; }
        .mood-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .mood-card { background: #1e293b; border: 2px solid #334155; border-radius: 10px; padding: 10px; cursor: pointer; transition: 0.2s; }
        .mood-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
        .mood-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; }
        .mood-card p { font-size: 12px; margin-top: 6px; color: #cbd5e1; }
        .player-list { text-align: left; background: #0f172a; padding: 10px 15px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
        .credits { margin-top: 15px; font-size: 12px; color: #64748b; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

    <!-- LOBİ EKRANI -->
    <div id="lobi-ekrani" class="card">
        <h1>Ghost Pulse Studio</h1>
        <div class="subtitle">Meme Party</div>

        <input type="text" id="kullanici-adi" placeholder="Oyuncu Adını Gir..." maxlength="15">
        <input type="text" id="oda-kodu" placeholder="Oda Kodu (Katılmak İçin)" maxlength="6">

        <button onclick="odaKur()">Yeni Oda Kur</button>
        <button onclick="odayaKatil()" class="secondary-btn">Odaya Katıl</button>

        <div class="credits">Yapımcı: Özgür GÖK</div>
    </div>

    <!-- OYUN VE ODA EKRANI -->
    <div id="oyun-ekrani" class="card hidden">
        <h2 style="color:#38bdf8;">Oda: <span id="aktif-oda-kodu"></span></h2>
        
        <div class="player-list">
            <strong>Oyuncular:</strong>
            <ul id="oyuncu-listesi" style="margin-left: 20px; margin-top: 5px;"></ul>
        </div>

        <div class="meme-box">
            <div class="subtitle">GÜNÜN MOOD / MEME DURUMU</div>
            <div id="meme-metni" class="meme-title">"Pazartesi sabahı alarma verilen tepki:"</div>
        </div>

        <p style="font-size: 14px; color: #94a3b8;">Senin Mood'un Hangisi? Bir Kart Seç:</p>
        
        <div class="mood-grid">
            <div class="mood-card" onclick="kartSec(1)">
                <img src="https://picsum.photos/id/1025/200/150" alt="Mood 1">
                <p>1. Uykulu ve Çaresiz</p>
            </div>
            <div class="mood-card" onclick="kartSec(2)">
                <img src="https://picsum.photos/id/237/200/150" alt="Mood 2">
                <p>2. Şok Olmuş</p>
            </div>
            <div class="mood-card" onclick="kartSec(3)">
                <img src="https://picsum.photos/id/1069/200/150" alt="Mood 3">
                <p>3. Umursamaz</p>
            </div>
            <div class="mood-card" onclick="kartSec(4)">
                <img src="https://picsum.photos/id/1062/200/150" alt="Mood 4">
                <p>4. Sinirli / Tepkili</p>
            </div>
        </div>

        <div id="secilen-durum" style="margin-top:15px; color:#4ade80; font-size:14px;"></div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://ghostpulsemood-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let mevcutOda = "";
        let oyuncuAdi = "";

        function odaKur() {
            oyuncuAdi = document.getElementById('kullanici-adi').value.trim();
            if(!oyuncuAdi) return alert("Lütfen adını gir!");

            mevcutOda = Math.floor(100000 + Math.random() * 900000).toString();
            odayaGir();
        }

        function odayaKatil() {
            oyuncuAdi = document.getElementById('kullanici-adi').value.trim();
            mevcutOda = document.getElementById('oda-kodu').value.trim();

            if(!oyuncuAdi || !mevcutOda) return alert("Adını ve Oda Kodunu gir!");
            odayaGir();
        }

        function odayaGir() {
            document.getElementById('lobi-ekrani').classList.add('hidden');
            document.getElementById('oyun-ekrani').classList.remove('hidden');
            document.getElementById('aktif-oda-kodu').innerText = mevcutOda;

            // Veritabanına oyuncuyu ekle
            db.ref('odalar/' + mevcutOda + '/oyuncular/' + oyuncuAdi).set({
                isim: oyuncuAdi,
                secim: "Henüz seçmedi"
            });

            // Oda oyuncularını canlı dinle
            db.ref('odalar/' + mevcutOda + '/oyuncular').on('value', (snapshot) => {
                const liste = document.getElementById('oyuncu-listesi');
                liste.innerHTML = "";
                snapshot.forEach((child) => {
                    const data = child.val();
                    const li = document.createElement('li');
                    li.innerText = `${data.isim} (${data.secim})`;
                    liste.appendChild(li);
                });
            });
        }

        function kartSec(kartId) {
            db.ref('odalar/' + mevcutOda + '/oyuncular/' + oyuncuAdi).update({
                secim: kartId + ". Kartı Seçti!"
            });
            document.getElementById('secilen-durum').innerText = "Seçimin odadaki herkese gönderildi!";
        }
    </script>
</body>
</html>
