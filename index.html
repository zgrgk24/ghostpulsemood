<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Pulse Studio - Meme Party</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .credits {
            color: #cbd5e1;
            font-size: 13px;
            margin-top: 20px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #0284c7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0369a1;
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #4ade80;
        }
    </style>

    <!-- Firebase SDK (Compat Sürümleri) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <h1>Ghost Pulse Studio</h1>
        <div class="subtitle">Meme Party</div>

        <input type="text" id="username" placeholder="Oyuncu Adını Gir..." maxlength="15">
        <button onclick="oyunaKatil()">Oyuna Katıl</button>

        <div id="status" class="status"></div>

        <div class="credits">Yapımcı: Özgür GÖK</div>
    </div>

    <script>
        // Firebase Yapılandırması (Doğru Avrupa Veritabanı URL'si)
        const firebaseConfig = {
            databaseURL: "https://ghostpulsemood-default-rtdb.europe-west1.firebasedatabase.app"
        };

        // Firebase Başlatma
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function oyunaKatil() {
            const nick = document.getElementById('username').value.trim();
            const statusDiv = document.getElementById('status');

            if (nick === "") {
                alert("Lütfen geçerli bir kullanıcı adı gir!");
                return;
            }

            // Realtime Database veri kaydetme
            database.ref('oyuncular/' + nick).set({
                kullaniciAdi: nick,
                girisTarihi: Date.now()
            }).then(() => {
                statusDiv.innerText = "Bağlantı Başarılı! Hoş geldin, " + nick;
            }).catch((error) => {
                statusDiv.innerText = "Hata oluştu: " + error.message;
            });
        }
    </script>
</body>
</html>
