<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Pulse Studio - Meme Party</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
        .card { background-color: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); width: 100%; max-width: 600px; text-align: center; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 5px; font-size: 26px; }
        .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background-color: #0284c7; color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 8px; transition: 0.2s; }
        button:hover { background-color: #0369a1; }
        .secondary-btn { background-color: #334155; }
        .secondary-btn:hover { background-color: #475569; }
        .ready-btn { background-color: #16a34a; }
        .ready-btn:hover { background-color: #15803d; }
        .hidden { display: none; }
        
        .table-container { position: relative; width: 100%; height: 260px; background: #0f172a; border-radius: 130px; border: 2px dashed #38bdf8; margin: 15px 0; display: flex; align-items: center; justify-content: center; }
        .table-center { text-align: center; max-width: 260px; padding: 10px; }
        .player-badge { position: absolute; background: #1e293b; border: 2px solid #4ade80; padding: 5px 10px; border-radius: 20px; font-size: 11px; }
        
        .hand-container { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; justify-content: center; }
        .hand-card { background: #0f172a; border: 2px solid #334155; border-radius: 10px; padding: 8px; width: 100px; cursor: pointer; flex-shrink: 0; transition: 0.2s; }
        .hand-card:hover { border-color: #38bdf8; transform: translateY(-4px); }
        .hand-card img { width: 100%; height: 75px; object-fit: cover; border-radius: 6px; }
        .hand-card p { font-size: 10px; margin-top: 4px; color: #cbd5e1; }
        .credits { margin-top: 15px; font-size: 12px; color: #64748b; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

    <!-- LOBİ EKRANI -->
    <div id="lobi-ekrani" class="card">
        <h1>Ghost Pulse Studio</h1>
        <div class="subtitle">Meme Party</div>

        <input type="text" id="kullanici-adi" placeholder="Oyuncu Adını Gir..." maxlength="15">
        <input type="text" id="oda-kodu" placeholder="Oda Kodu (Katılmak İçin)" maxlength="6">

        <button onclick="odaKur()">Yeni Oda Kur</button>
        <button onclick="odayaKatil()" class="secondary-btn">Odaya Katıl</button>

        <div class="credits">Yapımcı: Özgür GÖK</div>
    </div>

    <!-- HAZIRLIK EKRANI -->
    <div id="hazirlik-ekrani" class="card hidden">
        <h2 style="color:#38bdf8;">Oda Kodu: <span id="lobby-oda-kodu"></span></h2>
        <p class="subtitle">Herkes hazır olduğunda oyun başlayacak!</p>
        
        <div id="hazirlik-oyuncu-listesi" style="text-align:left; background:#0f172a; padding:12px; border-radius:10px; margin:12px 0; min-height:100px;"></div>

        <button onclick="hazirOl()" id="hazir-btn" class="ready-btn">Hazırım / Oyunu Başlat</button>
    </div>

    <!-- OYUN EKRANI -->
    <div id="oyun-ekrani" class="card hidden" style="max-width: 700px;">
        <div style="display:flex; justify-content:space-between; font-size:12px; color:#94a3b8; margin-bottom:8px;">
            <span>Oda: <span id="aktif-oda-kodu" style="color:#fff; font-weight:bold;"></span></span>
            <span>Tur: <span id="tur-sayisi" style="color:#38bdf8; font-weight:bold;">1</span></span>
        </div>

        <div class="table-container" id="yuvarlak-masa">
            <div class="table-center">
                <div style="font-size:10px; color:#94a3b8;">GÜNÜN YAZISI:</div>
                <div id="aktif-yazi" style="font-size:13px; font-weight:bold; color:#facc15; margin:5px 0;">Yükleniyor...</div>
            </div>
        </div>

        <div style="text-align:left; font-size:11px; color:#94a3b8; margin-bottom:4px;">Kartını Seç:</div>
        <div class="hand-container" id="el-kartlari"></div>
        <div id="oyun-durum" style="margin-top:10px; font-size:13px; color:#4ade80; font-weight:bold;"></div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://ghostpulsemood-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let mevcutOda = "";
        let oyuncuAdi = "";

        const yaziHavuzu = [
            "Pazartesi sabahı uyanınca verilen ilk tepki:",
            "Kredi kartı ekstresini görünce akıldan geçenler:",
            "Gece 3'te mutfakta gizlice atıştırma yaparken yakalanmak:",
            "Hoca derste ani bir soru sorunca takınılan masum ifade:",
            "Sınavdan beklediğinden yüksek not alınca:",
            "İnternet bağlantısı bir anda koptuğundaki sima:"
        ];

        const gorselHavuzu = [
            { id: 1, url: "https://picsum.photos/id/1025/200/150", aciklama: "Şok ve Şaşkınlık" },
            { id: 2, url: "https://picsum.photos/id/237/200/150", aciklama: "Derin Düşünce" },
            { id: 3, url: "https://picsum.photos/id/1069/200/150", aciklama: "Umursamaz" },
            { id: 4, url: "https://picsum.photos/id/1062/200/150", aciklama: "Sinirli Bakış" },
            { id: 5, url: "https://picsum.photos/id/338/200/150", aciklama: "Yorgun" }
        ];

        function odaKur() {
            oyuncuAdi = document.getElementById('kullanici-adi').value.trim();
            if(!oyuncuAdi) return alert("Kullanıcı adını gir!");
            mevcutOda = Math.floor(100000 + Math.random() * 900000).toString();
            
            db.ref('odalar/' + mevcutOda).set({ kurucu: oyuncuAdi }).then(() => lobineGec());
        }

        function odayaKatil() {
            oyuncuAdi = document.getElementById('kullanici-adi').value.trim();
            mevcutOda = document.getElementById('oda-kodu').value.trim();
            if(!oyuncuAdi || !mevcutOda) return alert("Adını ve Oda Kodunu gir!");

            db.ref('odalar/' + mevcutOda).once('value', (snap) => {
                if(!snap.exists()) return alert("Böyle bir oda bulunamadı!");
                lobineGec();
            });
        }

        function lobineGec() {
            document.getElementById('lobi-ekrani').classList.add('hidden');
            document.getElementById('hazirlik-ekrani').classList.remove('hidden');
            document.getElementById('lobby-oda-kodu').innerText = mevcutOda;

            db.ref('odalar/' + mevcutOda + '/oyuncular/' + oyuncuAdi).set({ isim: oyuncuAdi, hazir: false });

            db.ref('odalar/' + mevcutOda + '/oyuncular').on('value', (snap) => {
                const liste = document.getElementById('hazirlik-oyuncu-listesi');
                liste.innerHTML = "<strong>Odadakiler:</strong><br>";
                let herkesHazir = true, sayi = 0;

                snap.forEach(child => {
                    sayi++;
                    const d = child.val();
                    liste.innerHTML += `<div style="margin-top:4px; display:flex; justify-content:space-between;"><span>${d.isim}</span><span style="color:${d.hazir?'#4ade80':'#f87171'}">${d.hazir?'Hazır ✔':'Bekliyor'}</span></div>`;
                    if(!d.hazir) herkesHazir = false;
                });

                if(herkesHazir && sayi > 0) oyunuBaslat();
            });
        }

        function hazirOl() {
            db.ref('odalar/' + mevcutOda + '/oyuncular/' + oyuncuAdi).update({ hazir: true });
            document.getElementById('hazir-btn').innerText = "Hazırsın!";
            document.getElementById('hazir-btn').disabled = true;
        }

        function oyunuBaslat() {
            document.getElementById('hazirlik-ekrani').classList.add('hidden');
            document.getElementById('oyun-ekrani').classList.remove('hidden');
            document.getElementById('aktif-oda-kodu').innerText = mevcutOda;

            const rastgeleYazi = yaziHavuzu[Math.floor(Math.random() * yaziHavuzu.length)];
            db.ref('odalar/' + mevcutOda + '/aktifYazi').set(rastgeleYazi);

            kartlariDagit();
            masaDinle();
        }

        function kartlariDagit() {
            const container = document.getElementById('el-kartlari');
            container.innerHTML = "";
            for(let i=0; i<5; i++) {
                const k = gorselHavuzu[Math.floor(Math.random() * gorselHavuzu.length)];
                const div = document.createElement('div');
                div.className = 'hand-card';
                div.innerHTML = `<img src="${k.url}"><p>${k.aciklama}</p>`;
                div.onclick = () => {
                    document.getElementById('oyun-durum').innerText = `Seçimin gönderildi: ${k.aciklama}`;
                    db.ref('odalar/' + mevcutOda + '/hamleler/' + oyuncuAdi).set({ isim: oyuncuAdi, kart: k.aciklama });
                };
                container.appendChild(div);
            }
        }

        function masaDinle() {
            db.ref('odalar/' + mevcutOda + '/aktifYazi').on('value', (s) => {
                if(s.exists()) document.getElementById('aktif-yazi').innerText = `"${s.val()}"`;
            });

            db.ref('odalar/' + mevcutOda + '/oyuncular').on('value', (snap) => {
                const masa = document.getElementById('yuvarlak-masa');
                masa.querySelectorAll('.player-badge').forEach(b => b.remove());
                
                let oyuncular = [];
                snap.forEach(c => oyuncular.push(c.val()));
                
                oyuncular.forEach((o, i) => {
                    const aci = (i / oyuncular.length) * 2 * Math.PI;
                    const x = 95 * Math.cos(aci) + 130;
                    const y = 95 * Math.sin(aci) + 110;
                    const b = document.createElement('div');
                    b.className = 'player-badge';
                    b.style.left = `calc(50% + ${x - 40}px)`;
                    b.style.top = `calc(50% + ${y - 20}px)`;
                    b.innerText = o.isim;
                    masa.appendChild(b);
                });
            });
        }
    </script>
</body>
</html>
